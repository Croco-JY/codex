name: SOURCE OS CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"
      - name: Backend, migration and authorization integration tests
        working-directory: apps/api
        run: ./mvnw -B verify
      - name: Frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Frontend type checks, tests and production build
        working-directory: apps/web
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Start PostgreSQL and API
        run: |
          docker compose up -d --wait
          SPRING_PROFILES_ACTIVE=local java -jar apps/api/target/source-os-api-0.0.1-SNAPSHOT.jar > /tmp/api.log 2>&1 &
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Backend-owned API contract consistency
        run: |
          mkdir -p .local
          ./scripts/export-openapi.sh
          git diff --exit-code -- docs/openapi.json apps/web/src/api/schema.ts
      - name: Browser smoke test
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium && pnpm e2e
      - name: Terraform formatting and syntax
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0
      - run: terraform -chdir=infra/terraform fmt -check && terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-os-test-results
          path: |
            apps/api/target/surefire-reports
            apps/web/test-results
