name: STG-1A runtime verification
run-name: STG-1A runtime for 230faf61e68d468d26db04b8e7130125e443b280

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: stg-1a-runtime
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    environment: stg-1a-runtime
    timeout-minutes: 110
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Check out accepted candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 230faf61e68d468d26db04b8e7130125e443b280
          path: candidate
          persist-credentials: false

      - name: Install Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
          overwrite-settings: false

      - name: Install pinned OIDC verification dependencies
        run: |
          python3.12 -m venv "$RUNNER_TEMP/stg-1a-venv"
          "$RUNNER_TEMP/stg-1a-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r control/.github/stg-1a/requirements.txt

      - name: Authorize and run verification
        env:
          STG1A_REVIEW_TOKEN: ${{ secrets.STG1A_REVIEW_TOKEN }}
        run: '"$RUNNER_TEMP/stg-1a-venv/bin/python" -I control/.github/stg-1a/controller.py'

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stg-1a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stg-1a-evidence/result.json
            ${{ runner.temp }}/stg-1a-evidence/sha256.json
          if-no-files-found: error
          retention-days: 14
