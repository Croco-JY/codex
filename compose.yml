services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: source_os
      POSTGRES_USER: source_os
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_os -d source_os"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
